name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: "PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
        laravel: ["10.*", "11.*", "12.*"]
        include:
          # Map each Laravel version to the matching Testbench version
          - laravel: "10.*"
            testbench: "8.*"
          - laravel: "11.*"
            testbench: "9.*"
          - laravel: "12.*"
            testbench: "10.*"
        exclude:
          # Laravel 11+ requires PHP 8.2+
          - php: "8.1"
            laravel: "11.*"
          - php: "8.1"
            laravel: "12.*"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, dom
          coverage: none

      - name: Require Laravel & Testbench versions
        run: |
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --prefer-stable

      - name: Run tests
        run: vendor/bin/phpunit
